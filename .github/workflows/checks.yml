name: Check Python and Django

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Rebuild SQLite from JSON
        run: python -m db.import_json
      - name: Check Django configuration
        run: python manage.py check
      - name: Run tests
        run: python -m pytest -q
      - name: Run end-to-end smoke checks
        run: python scripts/smoke_test.py
      - name: Check style
        run: python -m flake8 . --extend-exclude=venv,.venv
      - name: Commit initial SQLite database
        if: github.event_name == 'push'
        run: |
          if git ls-files --error-unmatch data/culinary_lab.sqlite >/dev/null 2>&1; then
            echo "SQLite database is already tracked."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/culinary_lab.sqlite
          git commit -m "PR7: add generated SQLite database"
          git push
