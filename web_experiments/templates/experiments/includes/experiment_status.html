{% if experiment.is_cancelled %}
    <span class="status status-cancelled">Отменён</span>
{% elif experiment.result.taste_score >= 8 %}
    <span class="status status-success">Успешный</span>
{% elif experiment.result.taste_score >= 5 %}
    <span class="status status-average">Удовлетворительный</span>
{% else %}
    <span class="status status-failure">Неудачный</span>
{% endif %}
