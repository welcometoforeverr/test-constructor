{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Учет рецептов и кулинарных экспериментов">
    <title>{% block title %}CulinaryLab{% endblock %}</title>
    <link rel="icon" type="image/svg+xml"
          href="{% static 'homepage/img/logo.svg' %}">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="{% static 'homepage/css/style.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    {% include "includes/navigation.html" %}
    <main class="container py-5" id="main-content">
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        <div class="container d-flex flex-wrap justify-content-between gap-2">
            <span>CulinaryLab · учебный проект МИРЭА</span>
            <span>ПР5–ПР6 · Django + JSON</span>
        </div>
    </footer>
    <script src="{% static 'homepage/js/main.js' %}" defer></script>
    {% block scripts %}{% endblock %}
</body>
</html>
